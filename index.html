        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Radif Partners",
        "description": "Société éditrice de NetSalaire, plateforme de simulateurs fiscaux gratuits couvrant la France, le Maroc et seize autres pays.",
        "url": "https://netsalaire.com/fr/a-propos/",
        "foundingDate": "2025-01-01",
        "publishingPrinciples": "/fr/methodologie/",
        "knowsAbout": ["fiscalité des personnes physiques", "cotisations sociales", "salaire brut et net", "impôt sur le revenu"]
    }
    </script>
</head>
<body>
    <p>Redirection vers la version française. <a href="/fr/">Cliquez ici</a> si vous n'êtes pas redirigé automatiquement.</p>
</body>
</html>
